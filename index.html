<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Amma ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    height:100vh;

    background:
    linear-gradient(-45deg,
    #ff4d6d,
    #ff758f,
    #ff8fab,
    #ffc2d1,
    #ffd6e0);

    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

/* Background Animation */

@keyframes bgMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* Intro */

.intro{

    position:absolute;

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    color:white;

    z-index:10;
}

.intro h1{

    font-size:38px;

    margin-bottom:18px;

    text-shadow:
    0 0 25px rgba(255,255,255,0.4);

    animation:fadeIn 2s ease;
}

.intro p{

    max-width:320px;

    font-size:17px;

    line-height:1.8;
}

.start-btn{

    margin-top:30px;

    padding:16px 30px;

    border:none;

    border-radius:40px;

    background:white;

    color:#ff3366;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:0.3s;
}

.start-btn:hover{

    transform:scale(1.08);
}

/* Balloon Area */

.game{

    position:absolute;

    width:100%;
    height:100vh;

    display:none;
}

/* Balloon Base */

.balloon{

    position:absolute;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:12px;

    color:white;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    animation:float 4s ease-in-out infinite;

    box-shadow:
    inset -12px -12px 24px rgba(0,0,0,0.12),
    0 12px 30px rgba(0,0,0,0.25);

    transition:0.3s;
}

.balloon:hover{

    transform:scale(1.12);
}

.balloon::after{

    content:'';

    position:absolute;

    bottom:-28px;

    width:2px;
    height:28px;

    background:white;
}

/* Better Balloon Layout */

.balloon1{
    background:#ff006e;
    top:8%;
    left:8%;
    width:105px;
    height:135px;
}

.balloon2{
    background:#8338ec;
    top:12%;
    right:8%;
    width:95px;
    height:125px;
}

.balloon3{
    background:#3a86ff;
    top:32%;
    left:18%;
    width:115px;
    height:145px;
}

.balloon4{
    background:#ffbe0b;
    top:38%;
    right:12%;
    width:100px;
    height:130px;
}

.balloon5{
    background:#fb5607;
    top:58%;
    left:10%;
    width:110px;
    height:140px;
}

.balloon6{
    background:#ff4d6d;
    top:60%;
    right:10%;
    width:98px;
    height:128px;
}

.balloon7{
    background:#00c2a8;
    top:24%;
    left:42%;
    width:108px;
    height:138px;
}

.balloon8{
    background:#ff5edc;
    top:48%;
    left:40%;
    width:92px;
    height:122px;
}

.balloon9{
    background:#06d6a0;
    top:78%;
    left:28%;
    width:112px;
    height:142px;
}

.balloon10{
    background:#ff758f;
    top:74%;
    right:22%;
    width:100px;
    height:130px;
}

/* Floating */

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-16px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* Popup */

.popup{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:90%;
    max-width:360px;

    background:white;

    border-radius:26px;

    padding:18px;

    text-align:center;

    display:none;

    z-index:100;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.3);

    animation:popup 0.5s ease;
}

@keyframes popup{

    from{
        opacity:0;
        transform:translate(-50%,-45%);
    }

    to{
        opacity:1;
        transform:translate(-50%,-50%);
    }
}

.popup img{

    width:100%;
    height:300px;

    object-fit:cover;

    border-radius:18px;

    margin-bottom:15px;
}

.popup h2{

    color:#ff3366;

    font-size:22px;

    margin-bottom:10px;
}

.popup p{

    color:#444;

    line-height:1.8;

    font-size:15px;
}

.close{

    margin-top:18px;

    padding:12px 22px;

    border:none;

    border-radius:30px;

    background:#ff3366;

    color:white;

    cursor:pointer;

    font-weight:700;
}

/* Floating Hearts */

.heart{

    position:fixed;

    top:100vh;

    z-index:1;

    animation:rise linear forwards;
}

@keyframes rise{

    from{
        transform:translateY(0);
        opacity:1;
    }

    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

/* Fade */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Mobile */

@media(max-width:480px){

    .intro h1{
        font-size:34px;
    }

    .intro p{
        font-size:15px;
    }

    .balloon{
        font-size:12px;
    }

}

</style>
</head>

<body>

<!-- MUSIC -->

<audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<!-- INTRO -->

<div class="intro" id="intro">

    <h1>Happy Mother’s Day ❤️</h1>

    <p>
        Amma Raji 🌸<br><br>

        A tiny world of memories,
        laughter,
        and love —
        made specially for you 💖
    </p>

    <button class="start-btn" onclick="startSurprise()">
        Tap To Begin ✨
    </button>

</div>

<!-- BALLOONS -->

<div class="game" id="game">

<div class="balloon balloon1"
onclick="openPopup('children/subi1.jpg','You are our safe place ❤️','No matter how old we grow, your hugs still feel like home 🌸',event)">
Love</div>

<div class="balloon balloon2"
onclick="openPopup('children/subi2.jpg','The heart of our family 💖','Everything feels better when you are around Amma ✨',event)">
Smile</div>

<div class="balloon balloon3"
onclick="openPopup('children/subi3.jpg','Our forever superhero 🌷','Thank you for being strong even on difficult days ❤️',event)">
Amma</div>

<div class="balloon balloon4"
onclick="openPopup('children/subi4.jpg','You made childhood magical 💕','Every little thing you did became our favorite memory ✨',event)">
Hug</div>

<div class="balloon balloon5"
onclick="openPopup('children/subi9.jpg','Home will always be you 🏡','Your love is the warmest place in our lives 💖',event)">
Home</div>

<div class="balloon balloon6"
onclick="openPopup('children/subi6.jpg','Thank you for every sacrifice ❤️','You gave us everything even when you had little 🌸',event)">
Queen</div>

<div class="balloon balloon7"
onclick="openPopup('children/subi7.jpg','You are pure love 💗','No one in this world can love like you Amma ✨',event)">
Happy</div>

<div class="balloon balloon8"
onclick="openPopup('children/subi8.jpg','Our favorite person 💕','Life feels softer and safer because of you ❤️',event)">
Heart</div>

<div class="balloon balloon9"
onclick="openPopup('children/subi5.jpg','Forever your little girls 🌷','Even years later, we still need you every day 💖',event)">
Family</div>

<div class="balloon balloon10"
onclick="openPopup('children/subi10.jpg','Happy Mother’s Day Amma ❤️','Thank you for building a beautiful life for Subi and Diya ✨',event)">
Raji</div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

    <img id="popupImg">

    <h2 id="popupTitle"></h2>

    <p id="popupText"></p>

    <button class="close" onclick="closePopup()">
        Close 💖
    </button>

</div>

<script>

/* Start */

function startSurprise(){

    document.getElementById('intro').style.display='none';

    document.getElementById('game').style.display='block';

    document.getElementById('bgMusic').play();
}

/* Popup */

function openPopup(image,title,text,event){

    createConfetti(event.clientX,event.clientY);

    document.getElementById('popupImg').src=image;

    document.getElementById('popupTitle').innerHTML=title;

    document.getElementById('popupText').innerHTML=text;

    document.getElementById('popup').style.display='block';
}

function closePopup(){

    document.getElementById('popup').style.display='none';
}

/* Floating Hearts */

function createHeart(){

    const heart=document.createElement('div');

    heart.classList.add('heart');

    heart.innerHTML='💖';

    heart.style.left=Math.random()*100+'vw';

    heart.style.fontSize=
    (Math.random()*20+15)+'px';

    heart.style.animationDuration=
    (Math.random()*3+4)+'s';

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart,300);

/* Confetti */

function createConfetti(x,y){

    for(let i=0;i<35;i++){

        const confetti=document.createElement('div');

        confetti.style.position='fixed';

        confetti.style.left=x+'px';
        confetti.style.top=y+'px';

        confetti.style.width='10px';
        confetti.style.height='10px';

        confetti.style.borderRadius='50%';

        const colors=[
            '#ff006e',
            '#8338ec',
            '#3a86ff',
            '#ffbe0b',
            '#fb5607',
            '#06d6a0',
            '#ff5edc'
        ];

        confetti.style.background=
        colors[Math.floor(Math.random()*colors.length)];

        confetti.style.zIndex='999';

        document.body.appendChild(confetti);

        const angle=Math.random()*360;

        const distance=Math.random()*140+60;

        const xMove=Math.cos(angle)*distance;
        const yMove=Math.sin(angle)*distance;

        confetti.animate([

            {
                transform:'translate(0,0)',
                opacity:1
            },

            {
                transform:`translate(${xMove}px, ${yMove}px)`,
                opacity:0
            }

        ],{

            duration:1200,
            easing:'cubic-bezier(0,.9,.57,1)'
        });

        setTimeout(()=>{
            confetti.remove();
        },1200);
    }
}

</script>

</body>
</html>
